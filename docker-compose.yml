services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Pulls the model once, then exits. The UI waits for it to finish.
  model-puller:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "llama3.1:8b"]
    volumes:
      - ollama-models:/root/.ollama

  app:
    build: .
    depends_on:
      model-puller:
        condition: service_completed_successfully
    environment:
      RA_LLM_BACKEND: ollama
      RA_OLLAMA_HOST: http://ollama:11434
      RA_MODEL: llama3.1:8b
    ports:
      - "8501:8501"

volumes:
  ollama-models:
